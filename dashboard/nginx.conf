worker_processes auto;
pid /tmp/nginx.pid;                       # root filesystem is read-only in the pod; everything writable lives in /tmp (emptyDir)
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  sendfile on;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    # /api and /mcp never reach this server: the Ingress sends them straight to the gateway (same host => same-origin cookie).

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location /assets/ {                      # content-hashed filenames => safe to cache forever
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }
    location / {                              # single-page app: unknown paths fall back to index.html
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store";
      try_files $uri /index.html;
    }
  }
}
