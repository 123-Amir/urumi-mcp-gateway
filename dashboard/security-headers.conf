# Included in EVERY location: nginx drops server-level add_header lines as soon as a location defines its own add_header.
# CSP rationale: scripts/fonts/connect only from our own origin (the bundle is self-contained, fonts are bundled);
# style-src needs 'unsafe-inline' only because React renders style="" attributes; no inline <script> exists (checked on the build output).
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
