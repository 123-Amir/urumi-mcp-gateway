{{- /* One ServiceAccount per workload, with NO API token mounted and NO Role bound: nothing in this platform talks to the Kubernetes API,
       so a compromised pod has no Kubernetes permissions at all. */}}
{{- range $component := list "mariadb" "wordpress" "woo-mcp" "demo-utils" "demo-notes" "gateway" "dashboard" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "urumi.fullname" $ }}-{{ $component }}
  labels:
    {{- include "urumi.labels" (dict "root" $ "component" $component) | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
