{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{- $name := include "urumi.secretName" . }}
{{- /* On upgrade, reuse what is already in the cluster. Regenerating would break the DB password and make stored upstream credentials undecryptable. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $old := dict }}
{{- if $existing }}{{- $old = $existing.data }}{{- end }}
{{- $s := .Values.secrets }}
{{- $dbRoot := include "urumi.plain" (dict "old" $old "key" "MARIADB_ROOT_PASSWORD" "override" $s.mariadbRootPassword "gen" (randAlphaNum 28)) }}
{{- $dbPass := include "urumi.plain" (dict "old" $old "key" "MARIADB_PASSWORD" "override" $s.mariadbPassword "gen" (randAlphaNum 28)) }}
{{- $wpPass := include "urumi.plain" (dict "old" $old "key" "WORDPRESS_ADMIN_PASSWORD" "override" $s.wordpressAdminPassword "gen" (randAlphaNum 20)) }}
{{- $ck := include "urumi.plain" (dict "old" $old "key" "WC_CONSUMER_KEY" "override" $s.wcConsumerKey "gen" (printf "ck_%s" (randAlphaNum 40))) }}
{{- $cs := include "urumi.plain" (dict "old" $old "key" "WC_CONSUMER_SECRET" "override" $s.wcConsumerSecret "gen" (printf "cs_%s" (randAlphaNum 40))) }}
{{- $wooTok := include "urumi.plain" (dict "old" $old "key" "WOO_MCP_TOKEN" "override" $s.wooMcpToken "gen" (randAlphaNum 40)) }}
{{- $utilsTok := include "urumi.plain" (dict "old" $old "key" "UTILS_MCP_TOKEN" "override" $s.utilsMcpToken "gen" (randAlphaNum 40)) }}
{{- $notesTok := include "urumi.plain" (dict "old" $old "key" "NOTES_MCP_TOKEN" "override" $s.notesMcpToken "gen" (randAlphaNum 40)) }}
{{- $encKey := include "urumi.plain" (dict "old" $old "key" "GATEWAY_ENCRYPTION_KEY" "override" $s.gatewayEncryptionKey "gen" (randAlphaNum 32 | b64enc)) }}
{{- $adminKey := include "urumi.plain" (dict "old" $old "key" "BOOTSTRAP_ADMIN_API_KEY" "override" $s.bootstrapAdminApiKey "gen" (printf "umk_%s_%s" (randAlphaNum 8) (randAlphaNum 43))) }}
{{- /* The first three upstream servers, pre-registered in the gateway on first boot. Tokens are the credentials the gateway presents to them. */}}
{{- $seed := list
    (dict "slug" "woo" "name" "WooCommerce" "url" (printf "http://%s:3000/mcp" (include "urumi.svcHost" (dict "root" . "component" "woo-mcp"))) "authType" "bearer" "credential" $wooTok)
    (dict "slug" "utils" "name" "Utilities (demo)" "url" (printf "http://%s:3000/mcp" (include "urumi.svcHost" (dict "root" . "component" "demo-utils"))) "authType" "bearer" "credential" $utilsTok)
    (dict "slug" "notes" "name" "Notes (demo)" "url" (printf "http://%s:3000/mcp" (include "urumi.svcHost" (dict "root" . "component" "demo-notes"))) "authType" "bearer" "credential" $notesTok) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "urumi.labels" (dict "root" . "component" "secrets") | nindent 4 }}
type: Opaque
data:
  MARIADB_ROOT_PASSWORD: {{ $dbRoot | b64enc | quote }}
  MARIADB_PASSWORD: {{ $dbPass | b64enc | quote }}
  WORDPRESS_ADMIN_PASSWORD: {{ $wpPass | b64enc | quote }}
  WC_CONSUMER_KEY: {{ $ck | b64enc | quote }}
  WC_CONSUMER_SECRET: {{ $cs | b64enc | quote }}
  WOO_MCP_TOKEN: {{ $wooTok | b64enc | quote }}
  UTILS_MCP_TOKEN: {{ $utilsTok | b64enc | quote }}
  NOTES_MCP_TOKEN: {{ $notesTok | b64enc | quote }}
  GATEWAY_ENCRYPTION_KEY: {{ $encKey | b64enc | quote }}
  BOOTSTRAP_ADMIN_API_KEY: {{ $adminKey | b64enc | quote }}
  SEED_SERVERS_JSON: {{ $seed | toJson | b64enc | quote }}
  OPENAI_API_KEY: {{ $s.openaiApiKey | b64enc | quote }}
{{- end }}
