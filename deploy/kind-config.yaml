# kind cluster for local development.
#  * disableDefaultCNI: kind's default CNI (kindnet) does NOT enforce NetworkPolicy. We install Calico so the isolation in the chart is REAL.
#  * extraPortMappings: host :80/:443 -> the node, where ingress-nginx listens (ingress-ready label), so http://shop.localtest.me works.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: urumi
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16        # Calico's default pool
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - { containerPort: 80, hostPort: 80, protocol: TCP }
      - { containerPort: 443, hostPort: 443, protocol: TCP }
